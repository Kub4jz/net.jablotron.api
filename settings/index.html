<!doctype html>
<html>
<head>
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
</head>

<body>

<fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-i18n="settings.label">Settings</legend>
    <div class="homey-form-group">
        <label class="homey-form-label" for="username" data-i18n="settings.username">Username</label>
        <input class="homey-form-input" id="username" type="text" value=""/>
    </div>
    <div class="homey-form-group">
        <label class="homey-form-label" for="password" data-i18n="settings.password">Password</label>
        <input class="homey-form-input" id="password" type="password" value="" autocomplete="new-password"/>
    </div>
    <div class="homey-form-group">
        <label class="homey-form-label" for="pin" data-i18n="settings.pin">Pin</label>
        <input class="homey-form-input" id="pin" type="password" value="" autocomplete="off" inputmode="numeric"/>
    </div>
    <div class="homey-form-group" id="clear-pin-group" style="display: none">
        <label class="homey-form-checkbox">
            <input class="homey-form-checkbox-input" id="clear-pin" type="checkbox"/>
            <span class="homey-form-checkbox-checkmark"></span>
            <span class="homey-form-checkbox-text" data-i18n="settings.clearPin">Remove stored PIN</span>
        </label>
    </div>
    <label class="homey-form-label" for="polling" data-i18n="settings.polling.interval">Polling Interval</label>
    <select class="homey-form-select" name="polling" id="polling">
        <option value="15" data-i18n="settings.polling.15">15 Seconds</option>
        <option value="30" data-i18n="settings.polling.30">30 Seconds</option>
        <option value="60" data-i18n="settings.polling.60">1 Minute</option>
        <option value="120" data-i18n="settings.polling.120">2 Minutes</option>
        <option value="300" data-i18n="settings.polling.300">5 Minutes</option>
        <option value="600" data-i18n="settings.polling.600">10 Minutes</option>
        <option value="1800" data-i18n="settings.polling.1800">30 Minutes</option>
    </select>

</fieldset>

<p>
    <button id="save" class="right homey-button-primary-full" data-i18n="settings.save">Save Changes</button>
</p>

<script type="text/javascript">
    // Password and PIN are never sent to this page - it only learns whether they are set.
    // New values go through the app API, which stores them encrypted.
    const usernameElement = document.getElementById('username');
    const passwordElement = document.getElementById('password');
    const pinElement = document.getElementById('pin');
    const clearPinGroup = document.getElementById('clear-pin-group');
    const clearPinElement = document.getElementById('clear-pin');
    const pollingElement = document.getElementById('polling');
    const saveElement = document.getElementById('save');

    function api(Homey, method, path, body) {
        return new Promise((resolve, reject) => {
            Homey.api(method, path, body, (err, result) => err ? reject(err) : resolve(result));
        });
    }

    function render(Homey, settings) {
        const stored = Homey.__('settings.keepUnchanged');

        usernameElement.value = settings.username || '';
        pollingElement.value = settings.polling || '30';
        passwordElement.value = '';
        passwordElement.placeholder = settings.hasPassword ? stored : '';
        pinElement.value = '';
        pinElement.placeholder = settings.hasPin ? stored : '';
        clearPinElement.checked = false;
        clearPinGroup.style.display = settings.hasPin ? '' : 'none';
    }

    async function onHomeyReady(Homey) {
        try {
            render(Homey, await api(Homey, 'GET', '/settings'));
        } catch (err) {
            Homey.alert(err.message || err);
        }

        Homey.ready();

        saveElement.addEventListener('click', async function () {
            saveElement.classList.add('is-loading');

            try {
                await api(Homey, 'PUT', '/settings', {
                    username: usernameElement.value,
                    password: passwordElement.value,
                    pin: pinElement.value,
                    clearPin: clearPinElement.checked,
                    polling: pollingElement.value,
                });

                render(Homey, await api(Homey, 'GET', '/settings'));
                Homey.alert(Homey.__('settings.saved'), 'info');
            } catch (err) {
                Homey.alert(err.message || err);
            } finally {
                saveElement.classList.remove('is-loading');
            }
        });
    }
</script>

</body>

</html>
