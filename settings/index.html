<!doctype html>
<html>
<head>
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
</head>

<body>

<fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-i18n="settings.label">Settings</legend>
    <div class="homey-form-group">
        <label class="homey-form-label" for="username" data-i18n="settings.username">Username</label>
        <input class="homey-form-input" id="username" type="text" value=""/>
    </div>
    <div class="homey-form-group">
        <label class="homey-form-label" for="password" data-i18n="settings.password">Password</label>
        <input class="homey-form-input" id="password" type="password" value=""/>
    </div>
    <div class="homey-form-group">
        <label class="homey-form-label" for="pin" data-i18n="settings.pin">Pin</label>
        <input class="homey-form-input" id="pin" type="password" value=""/>
    </div>
    <label class="homey-form-label" for="polling" data-i18n="settings.polling.interval">Polling Interval</label>
    <select class="homey-form-select" name="polling" id="polling">
        <option value="15" data-i18n="settings.polling.15">15 Seconds</option>
        <option value="30" data-i18n="settings.polling.30">30 Seconds</option>
        <option value="60" data-i18n="settings.polling.60">1 Minute</option>
        <option value="120" data-i18n="settings.polling.120">2 Minutes</option>
        <option value="300" data-i18n="settings.polling.300">5 Minutes</option>
        <option value="600" data-i18n="settings.polling.600">10 Minutes</option>
        <option value="1800" data-i18n="settings.polling.1800">30 Minutes</option>
    </select>

</fieldset>

<p>
    <button id="save" class="right homey-button-primary-full" data-i18n="settings.save">Save Changes</button>
</p>

<script type="text/javascript">

    const usernameElement = document.getElementById('username');
    const passwordElement = document.getElementById('password');
    const pinElement = document.getElementById('pin');
    const pollingElement = document.getElementById('polling');
    const saveElement = document.getElementById('save');
    let oldusername = '';
    let oldpassword = '';
    let oldpin = '';
    let oldpolling = '';

    function onHomeyReady(Homey) {
        // Tell Homey we're ready to be displayed
        Homey.ready();

        Homey.get('username', function (err, username) {
            if (err) return Homey.alert(err);
            usernameElement.value = username;
            oldusername = username;
        });

        Homey.get('password', function (err, password) {
            if (err) return Homey.alert(err);
            passwordElement.value = password;
            oldpassword = password;
        });

        Homey.get('pin', function (err, pin) {
            if (err) return Homey.alert(err);
            pinElement.value = pin;
            oldpin = pin;
        });

        Homey.get('polling', function (err, polling) {
            if (err) return Homey.alert(err);
            if (polling === null || polling === undefined || polling === '') {
                polling = '30';
            }
            pollingElement.value = polling;
            oldpolling = polling;
        });

        saveElement.addEventListener('click', async function (e) {

            if (oldusername != usernameElement.value
                || oldpassword != passwordElement.value
                || oldpin != pinElement.value
                || oldpolling != pollingElement.value) {
                document.getElementById('save').classList.add("is-loading");
                await Homey.set('username', usernameElement.value, function (err) {
                    if (err) return Homey.alert(err);
                });
                await Homey.set('password', passwordElement.value, function (err) {
                    if (err) return Homey.alert(err);
                });
                await Homey.set('pin', pinElement.value, function (err) {
                    if (err) return Homey.alert(err);
                });
                await Homey.set('polling', pollingElement.value, function (err) {
                    if (err) return Homey.alert(err);
                });
            }
        });
    }
</script>

</body>

</html>
